
<p>&lt;!doctype html&gt;</p>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="1; url=/#portfolio" />
    <link rel="canonical" href="/#portfolio" />
    <title>Redirecting to projects</title>
    <script>
      const filter = location.hash.replace("#", "");
      if (["ai-vision", "data-automation", "products", "esports"].includes(filter)) {
        location.replace("/?filter=" + filter + "#portfolio");
      }
    </script>
  </head>
  <body>
    <p>
      <a href="/#portfolio">
        Continue to projects
      </a>
    </p>
  </body>
</html>
