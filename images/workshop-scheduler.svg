<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 170" width="340" height="170">
  <defs>
    <linearGradient id="bgShop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#3a3a3a"/>
    </linearGradient>
  </defs>
  <rect width="340" height="170" rx="14" fill="url(#bgShop)"/>

  <!-- agenda: 4 bay columns -->
  <g>
    <g fill="#4E4E4E">
      <rect x="26"  y="20" width="28" height="7" rx="2"/>
      <rect x="60"  y="20" width="28" height="7" rx="2"/>
      <rect x="94"  y="20" width="28" height="7" rx="2"/>
      <rect x="128" y="20" width="28" height="7" rx="2"/>
    </g>
    <g stroke="#4E4E4E" stroke-width="0.8" opacity="0.55">
      <path d="M22 44 H160 M22 60 H160 M22 76 H160 M22 92 H160"/>
    </g>
    <g stroke="#4E4E4E" stroke-width="0.8" opacity="0.35">
      <path d="M26 32 V108 M60 32 V108 M94 32 V108 M128 32 V108 M156 32 V108"/>
    </g>
    <!-- appointment blocks -->
    <g>
      <rect x="27"  y="34" width="26" height="22" rx="2" fill="#D7FF01"/>
      <rect x="27"  y="80" width="26" height="16" rx="2" fill="#4E4E4E"/>
      <rect x="61"  y="48" width="26" height="28" rx="2" fill="#4E4E4E"/>
      <rect x="95"  y="34" width="26" height="14" rx="2" fill="#4E4E4E"/>
      <rect x="95"  y="62" width="26" height="26" rx="2" fill="#D7FF01"/>
      <rect x="129" y="56" width="26" height="20" rx="2" fill="#D7FF01" opacity="0.45"/>
    </g>
    <!-- current-time line -->
    <g>
      <path d="M22 72 H160" stroke="#ff4d4d" stroke-width="1.6"/>
      <circle cx="22" cy="72" r="2.5" fill="#ff4d4d"/>
    </g>
  </g>

  <!-- gear with clock hands: mechanic + scheduling -->
  <g transform="translate(248 62)">
    <g fill="#D7FF01">
      <rect x="-4" y="-36" width="8" height="12" rx="1.5"/>
      <rect x="-4" y="-36" width="8" height="12" rx="1.5" transform="rotate(45)"/>
      <rect x="-4" y="-36" width="8" height="12" rx="1.5" transform="rotate(90)"/>
      <rect x="-4" y="-36" width="8" height="12" rx="1.5" transform="rotate(135)"/>
      <rect x="-4" y="-36" width="8" height="12" rx="1.5" transform="rotate(180)"/>
      <rect x="-4" y="-36" width="8" height="12" rx="1.5" transform="rotate(225)"/>
      <rect x="-4" y="-36" width="8" height="12" rx="1.5" transform="rotate(270)"/>
      <rect x="-4" y="-36" width="8" height="12" rx="1.5" transform="rotate(315)"/>
    </g>
    <circle r="27" fill="#D7FF01"/>
    <circle r="20" fill="#1E1E1E"/>
    <g stroke="#D7FF01" stroke-width="2.6" stroke-linecap="round" fill="none">
      <path d="M0 0 V-12"/>
      <path d="M0 0 L9 5"/>
    </g>
    <circle r="2.2" fill="#D7FF01"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="170" y="136" font-size="17" font-weight="800" fill="#D7FF01" letter-spacing="2">APPOINTMENTS</text>
    <text x="170" y="154" font-size="9"  font-weight="500" fill="#c9c9c9" letter-spacing="4">AUTO REPAIR SHOP · LAN</text>
  </g>
</svg>
