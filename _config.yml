title: "Jose Paredes"
first_name: Jose
last_name: Paredes
description: "Data Scientist and AI Engineer building computer-vision systems, automation and local-first products."
url: "https://jparedesds.github.io"
baseurl: ""
lang: en
languages: ["en", "es"]
default_lang: "en"
parallel_localization: false
lang_vars: ["lang"]

collections:
  projects:
    output: true

plugins:
  - jekyll-polyglot

include: ["_pages"]

exclude_from_localization:
  - assets
  - images
  - cleanyourmail
  - propovcs2
  - cs2pov
  - murdoku
  - projects
  - google75a8559a473af765.html
  - tiktoktlkXmcJe9C9XczFLZBDaijGBy6abp0WB.txt
  - profile.jpg
  - resume.pdf
  - LICENSE
  - NOTICE
  - README.md
  - docs
  - test

exclude:
  - docs
  - test
  - node_modules
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - playwright.config.js
  - README.md
  - NOTICE
  - blog-preview-sync.mjs
  - test-results
  - playwright-report

keep_files:
  - .nojekyll
