          - Flask
          - APIs REST
          - autenticación JWT
          - WebSockets
          - integración IMAP/SMTP
      - name: Frontend
        keywords: [React 18, Tailwind CSS, Framer Motion, Axios]
      - name: Ciencia de Datos y ML
        keywords:
