          - orquestación de agentes de IA
    Languages:
      - name: Español
        summary: Nativo
      - name: Inglés
        summary: Competencia profesional (B2)
    Projects:
      - name: DocFlow SaaS - Plataforma de Gestión Documental
        summary: >-
          Arquitecté y dirigí el desarrollo asistido por IA (Claude) de un SaaS completo
          multiinquilino para la gestión documental industrial en EIPSA. Diseñé la
          arquitectura del sistema, definí los requisitos y orquesté agentes de IA para
          construir 21 módulos de enrutadores de API, 24 capas de servicio y 24 páginas de
          frontend. Las funcionalidades incluyen procesamiento documental con IA (API de
          Anthropic), integración de firma electrónica con DocuSign, ingesta automatizada
          de correo (IMAP/SMTP), autenticación JWT, i18n, programación de copias de
          seguridad y despliegue con Docker y CI/CD mediante GitHub Actions. Actualmente
          en uso en producción.
        start_date: 2024-01
        end_date: Actualidad
        url: https://github.com/jparedesDS/docflow
        highlights:
          - "Tecnologías: FastAPI, React 18, Tailwind CSS, Docker, JWT, API de Anthropic, DocuSign"
      # El CV original no fecha estos proyectos. `end_date` es explícito porque la
      # plantilla lo exige; sin `start_date` no se muestra ninguna insignia de fecha.
      - name: Detección en Inspección por Líquidos Penetrantes
        end_date: Actualidad
        summary: >-
          Desarrollé un modelo de IA para la detección automatizada de resultados de
          ensayos por líquidos penetrantes en el control de calidad metalúrgico. Entrenado
          con datos de inspección industrial y desplegado como modelo de HuggingFace para
          la clasificación de defectos en tiempo real en entornos de fabricación.
        highlights:
          - "Tecnologías: YOLO11, Visión por Computador, HuggingFace, Python"
      - name: Sistema de Detección de Defectos de Soldadura
        end_date: Actualidad
        summary: >-
          Construí un sistema de detección de objetos para la identificación y
          clasificación en tiempo real de defectos de soldadura en entornos industriales.
          Modelo publicado en HuggingFace. Más de 14 estrellas en GitHub.
        highlights:
          - "Tecnologías: YOLO11, Visión por Computador, Aprendizaje Profundo, HuggingFace"
      - name: Herramienta de Extracción de Datos DXF
        end_date: Actualidad
        summary: >-
          Creé una herramienta que combina aprendizaje profundo con análisis de CAD para
          extraer y clasificar automáticamente entidades de planos técnicos DXF. Redujo el
          tiempo de introducción manual de datos en aproximadamente un 80 % en flujos de
          ingeniería. Más de 18 estrellas y 4 bifurcaciones en GitHub.
        highlights:
          - "Tecnologías: Python, automatización de CAD, aprendizaje profundo, extracción de datos"
      - name: Bot de Apuestas Automáticas para Polymarket
        end_date: Actualidad
        summary: >-
          Bot de trading algorítmico para mercados de predicción de BTC en Polymarket.
          Implementa dimensionamiento por criterio de Kelly, backtesting de Monte Carlo
          (más de 10.000 simulaciones), lógica de salida de emergencia, operaciones en
          cadena sin gas y un panel de control en tiempo real por Telegram. Más de 5
          estrellas en GitHub.
        highlights:
          - "Tecnologías: Python, APIs REST, criterio de Kelly, Monte Carlo, Telegram"
      - name: Automatización de Correo MAPI
        end_date: Actualidad
        summary: >-
          Pipeline automatizado de ingesta documental: captura correos mediante
          Outlook/IMAP, extrae adjuntos y metadatos, y carga los datos estructurados en
          Excel y sistemas ERP. Eliminó el procesamiento manual de correo para el control
          documental.
        highlights:
          - "Tecnologías: Python, Outlook/IMAP, Excel, integración con ERP"
    Additional Information:
      - bullet: >-
          Plataformas: HuggingFace (jparedesDS) - más de 10 modelos publicados | Kaggle
          (joseparedesc) | Tableau Public
      - bullet: >-
          Código abierto: más de 33 repositorios públicos, más de 268 seguidores en
          GitHub, logros Pull Shark y Starstruck
      - bullet: >-
          Visión por Computador: más de 10 modelos YOLO (v9-v12) para detección de objetos
          en tiempo real desplegados en HuggingFace
      - bullet: >-
          Competiciones: Medalla de Bronce en Kaggle - Clasificación de Imágenes
          Multietiqueta (3.er puesto, ResNet152)
