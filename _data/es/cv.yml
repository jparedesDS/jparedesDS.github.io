cv:
  name: Jose Paredes Colmenarejo
  label: Científico de Datos | Ingeniero de IA | Ingeniero de ML
  location: Madrid, España
  email: jparedescolmenarejo@gmail.com
  website: https://jparedesds.github.io
  summary: >-
    Científico de Datos e Ingeniero de IA con experiencia práctica construyendo modelos
    de ML en producción, aplicaciones asistidas por IA y sistemas de automatización para
    ingeniería industrial. Arquitecté DocFlow, una plataforma SaaS multiinquilino de
    gestión documental construida mediante desarrollo asistido por IA (Claude/API de
    Anthropic), coordinando todo el ciclo de vida del producto, desde el diseño del
    sistema hasta el despliegue con Docker. Colaborador activo en código abierto con más
    de 33 repositorios, más de 268 seguidores en GitHub y más de 10 modelos de visión por
    computador publicados en HuggingFace. Sólida experiencia en Visión por Computador
    (YOLO), NLP, trading algorítmico, flujos de trabajo con IA agéntica y desarrollo de
    pipelines de datos de extremo a extremo. Bilingüe (español/inglés).
  sections:
    Experience:
      - company: EIPSA - Española de Instrumentación Primaria S.A.
        position: Analista de Datos e Ingeniero de IA
        start_date: 2024-01
        end_date: Actualidad
        location: Madrid, España
        highlights:
          - >-
            Arquitecté DocFlow, una plataforma SaaS completa de gestión documental,
            usando desarrollo asistido por IA (Claude) para diseñar y construir el
            sistema completo (FastAPI + React). Actualmente en uso en producción.
          - >-
            Construí y desplegué modelos de visión por computador basados en YOLO para la
            detección automática de defectos en el control de calidad metalúrgico
            (inspección por líquidos penetrantes, defectos de soldadura).
          - >-
            Creé pipelines automatizados de extracción de datos de planos técnicos DXF
            mediante aprendizaje profundo, reduciendo el tiempo de procesamiento manual
            en un 80 %.
          - >-
            Automaticé flujos de correo electrónico a ERP, eliminando la introducción
            manual de documentos para más de 500 documentos entrantes al mes.
          - >-
            Construí cuadros de mando interactivos en Tableau para el seguimiento
            documental de proyectos en tiempo real con clientes internacionales.
          - >-
            Coordiné el envío de documentación con contratistas internacionales (Tecnicas
            Reunidas) usando las plataformas eGesdoc/VDDL.
      - company: Comunicación Permanente S.L.
        position: Técnico de Gestión de Datos
        start_date: 2021-01
        end_date: 2023-12
        location: Madrid, España
        highlights:
          - >-
            Gestioné y mantuve la base de datos de clientes con más de 10.000 registros,
            garantizando la integridad y exactitud de los datos.
          - >-
            Procesé y validé flujos de datos entrantes para el seguimiento de incidencias
            técnicas y la respuesta ante emergencias.
          - >-
            Desarrollé procedimientos internos de generación de informes que mejoraron un
            25 % el seguimiento de la resolución de incidencias.
      - company: GRUPO ANOVO S.L.
        position: Técnico de Laboratorio Electrónico
        start_date: 2015-01
        end_date: 2020-12
        location: Madrid, España
        highlights:
          - >-
            Diagnostiqué y reparé más de 50 dispositivos electrónicos por semana (Samsung,
            ZTE, multimarca) con una tasa de calidad superior al 95 %.
          - >-
            Gestioné datos de producción y métricas de control de calidad para los flujos
            de reparación de dispositivos.
    Education:
      - institution: The Bridge | Digital Talent Accelerator
        area: Ciencia de Datos
        studyType: Bootcamp
        start_date: 2021-09
        end_date: 2022-06
        location: Madrid, España
        highlights:
          - >-
            Aprendizaje supervisado y no supervisado, aprendizaje profundo, NLP con
            Transformers, Visión por Computador (OpenCV), predicción de series temporales,
            narración de datos y despliegue con Flask.
      - institution: Centro de Formación Padre Piquer
        area: Telecomunicaciones
        studyType: Grado Superior en Telecomunicaciones
        start_date: 2010-09
        end_date: 2012-06
        location: Madrid, España
    Skills:
