            Managed and maintained customer database with 10,000+ records, ensuring data
            integrity and accuracy.
          - >-
            Processed and validated incoming data streams for technical incident tracking
            and emergency response.
          - >-
            Developed internal reporting procedures that improved incident resolution
            tracking by 25%.
      - company: GRUPO ANOVO S.L.
