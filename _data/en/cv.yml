cv:
  name: Jose Paredes Colmenarejo
  label: Data Scientist | AI Engineer | ML Engineer
  location: Madrid, Spain
  email: jparedescolmenarejo@gmail.com
  website: https://jparedesds.github.io
  summary: >-
    Data Scientist and AI Engineer with hands-on experience building production-grade ML
    models, AI-assisted applications, and automation systems for industrial engineering.
    Architected DocFlow, a multi-tenant SaaS document management platform built using
    AI-assisted development (Claude/Anthropic API), orchestrating the full product
    lifecycle from system design to Docker deployment. Active open-source contributor
    with 33+ repositories, 268+ GitHub followers, and 10+ computer vision models
    published on HuggingFace. Strong expertise in Computer Vision (YOLO), NLP,
    algorithmic trading, agentic AI workflows, and end-to-end data pipeline development.
    Bilingual (Spanish/English).
  sections:
    Experience:
      - company: EIPSA - Española de Instrumentación Primaria S.A.
        position: Data Analyst & AI Engineer
        start_date: 2024-01
        end_date: Present
        location: Madrid, Spain
        highlights:
          - >-
            Architected DocFlow, a full-stack SaaS document management platform, using
            AI-assisted development (Claude) to design and build the complete system
            (FastAPI + React). Now in production use.
          - >-
            Built and deployed YOLO-based computer vision models for automated defect
            detection in metallurgy quality control (penetrant inspection, welding
            defects).
          - >-
            Created automated data extraction pipelines from DXF technical drawings using
            deep learning, reducing manual processing time by 80%.
          - >-
            Automated email-to-ERP workflows, eliminating manual document entry for 500+
            monthly incoming documents.
          - >-
            Built interactive Tableau dashboards for real-time project documentation
            tracking across international clients.
          - >-
            Coordinated documentation submissions with international contractors (Tecnicas
            Reunidas) using eGesdoc/VDDL platforms.
      - company: Comunicación Permanente S.L.
