          integration, automated email ingestion (IMAP/SMTP), JWT authentication, i18n,
          backup scheduling, and Docker deployment with CI/CD via GitHub Actions.
          Currently in production use.
        start_date: 2024-01
        end_date: Present
        url: https://github.com/jparedesDS/docflow
        highlights:
          - "Stack: FastAPI, React 18, Tailwind CSS, Docker, JWT, Anthropic API, DocuSign"
      # The resume does not date these projects. `end_date` is explicit because the
      # template requires it; without a `start_date` no date badge is rendered.
      - name: Fluorescent Penetrant Inspection Detection
        end_date: Present
        summary: >-
          Developed an AI model for automated detection of liquid penetrant test results
          in metallurgy quality control. Trained on industrial inspection data and
          deployed as a HuggingFace model for real-time defect classification in
          manufacturing environments.
        highlights:
          - "Stack: YOLO11, Computer Vision, HuggingFace, Python"
      - name: Welding Defects Detection System
        end_date: Present
        summary: >-
          Built an object detection system for real-time identification and
          classification of welding defects in industrial environments. Model published on
          HuggingFace. 14+ GitHub stars.
        highlights:
          - "Stack: YOLO11, Computer Vision, Deep Learning, HuggingFace"
      - name: DXF Data Extraction Tool
        end_date: Present
        summary: >-
          Created a tool combining deep learning with CAD parsing to automatically
          extract and classify entities from DXF technical drawings. Reduced manual data
          entry time by approximately 80% in engineering workflows. 18+ GitHub stars, 4
          forks.
        highlights:
          - "Stack: Python, CAD automation, deep learning, data extraction"
      - name: Polymarket Auto-Betting Bot
        end_date: Present
        summary: >-
          Algorithmic trading bot for BTC prediction markets on Polymarket. Implements
          Kelly Criterion sizing, Monte Carlo backtesting (10,000+ simulations), bail-out
          logic, gasless on-chain operations, and real-time Telegram dashboard. 5+ GitHub
          stars.
        highlights:
          - "Stack: Python, REST APIs, Kelly Criterion, Monte Carlo, Telegram"
      - name: Email MAPI Automation
        end_date: Present
        summary: >-
          Automated documentation ingestion pipeline: captures emails via Outlook/IMAP,
          extracts attachments and metadata, and loads structured data into Excel and ERP
          systems. Eliminated manual email processing for document control.
        highlights:
          - "Stack: Python, Outlook/IMAP, Excel, ERP integration"
