<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
  <title>DocFlow architecture: email and ERP exchange with a FastAPI backend, a React frontend, DocuSign signatures, Docker and CI</title>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0 L8 4.5 L0 9 z" fill="#80aadd"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="674" rx="12" fill="#292a2d" stroke="#3a3b3d"/>
  <g font-family="ui-monospace, 'Fira Mono', 'Cascadia Mono', Consolas, monospace">
    <text x="60" y="80" font-size="30" fill="#f8f8ff">DocFlow · internal SaaS</text>
    <text x="60" y="114" font-size="17" fill="#a8a8b3">document control for engineering project orders</text>
    <rect x="972" y="52" width="168" height="36" rx="18" fill="none" stroke="#80aadd" stroke-width="1.5"/>
    <text x="1056" y="76" font-size="14" fill="#80aadd" text-anchor="middle">IN PRODUCTION</text>

    <!-- email -->
    <rect x="60" y="196" width="200" height="94" rx="10" fill="#2e2e33" stroke="#3a3b3d" stroke-width="1.5"/>
    <rect x="88" y="226" width="40" height="30" rx="4" fill="none" stroke="#80aadd" stroke-width="2"/>
    <path d="M88 230 l20 14 l20 -14" fill="none" stroke="#80aadd" stroke-width="2"/>
    <text x="150" y="250" font-size="20" fill="#f8f8ff">email</text>

    <!-- ERP -->
    <rect x="60" y="346" width="200" height="94" rx="10" fill="#2e2e33" stroke="#3a3b3d" stroke-width="1.5"/>
    <ellipse cx="108" cy="376" rx="20" ry="7" fill="none" stroke="#80aadd" stroke-width="2"/>
    <path d="M88 376 v30 a20 7 0 0 0 40 0 v-30" fill="none" stroke="#80aadd" stroke-width="2"/>
    <path d="M88 391 a20 7 0 0 0 40 0" fill="none" stroke="#80aadd" stroke-width="2"/>
    <text x="150" y="400" font-size="20" fill="#f8f8ff">ERP</text>

    <!-- FastAPI core -->
    <rect x="480" y="246" width="240" height="144" rx="10" fill="#2e2e33" stroke="#80aadd" stroke-width="2"/>
    <path d="M606 268 l-14 24 h10 l-6 20 l18 -26 h-10 l8 -18 z" fill="#80aadd"/>
    <text x="600" y="336" font-size="22" fill="#f8f8ff" text-anchor="middle">FastAPI</text>
    <text x="600" y="362" font-size="13" fill="#a8a8b3" text-anchor="middle">21 routers · 24 services</text>

    <!-- React frontend -->
    <rect x="940" y="246" width="200" height="144" rx="10" fill="#2e2e33" stroke="#3a3b3d" stroke-width="1.5"/>
    <circle cx="1040" cy="286" r="4" fill="#80aadd"/>
    <ellipse cx="1040" cy="286" rx="26" ry="10" fill="none" stroke="#80aadd" stroke-width="1.5"/>
    <ellipse cx="1040" cy="286" rx="26" ry="10" fill="none" stroke="#80aadd" stroke-width="1.5" transform="rotate(60 1040 286)"/>
    <ellipse cx="1040" cy="286" rx="26" ry="10" fill="none" stroke="#80aadd" stroke-width="1.5" transform="rotate(120 1040 286)"/>
    <text x="1040" y="336" font-size="22" fill="#f8f8ff" text-anchor="middle">React</text>
    <text x="1040" y="362" font-size="13" fill="#a8a8b3" text-anchor="middle">24 screens</text>

    <!-- DocuSign -->
    <rect x="480" y="470" width="240" height="86" rx="10" fill="#2e2e33" stroke="#3a3b3d" stroke-width="1.5"/>
    <path d="M508 522 c6 -16 12 -16 14 -6 s8 10 12 -2 s10 -8 14 2" fill="none" stroke="#80aadd" stroke-width="2" stroke-linecap="round"/>
    <text x="566" y="510" font-size="20" fill="#f8f8ff">DocuSign</text>
    <text x="566" y="534" font-size="13" fill="#a8a8b3">e-signatures</text>

    <!-- flows -->
    <line x1="272" y1="243" x2="468" y2="283" stroke="#80aadd" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="272" y1="393" x2="468" y2="353" stroke="#80aadd" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="732" y1="318" x2="928" y2="318" stroke="#80aadd" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="600" y1="402" x2="600" y2="458" stroke="#80aadd" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

    <line x1="60" y1="592" x2="1140" y2="592" stroke="#3a3b3d" stroke-width="1.5"/>
    <text x="60" y="636" font-size="16" fill="#80aadd">Docker + CI · JWT auth · in daily use</text>
  </g>
</svg>