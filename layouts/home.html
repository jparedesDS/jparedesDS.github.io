<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">

<head>
    <title>
        {{ i18n "home" }} | {{ .Site.Params.author.name }}
    </title>

    {{ partial "head.html" . }}

</head>

<body>

    <div class="flexWrapper">
        {{ partial "header.html" . }}

        <div class="content vertical">
            <main class="main">
                <div class="indexWrapper profileCard">
                    <img class="profileAvatar" src="/profile.jpg" alt="Pixel-art portrait of Jose Paredes" width="170" height="170">
                    <h1 class="profileName">Jose Paredes</h1>
                    <p class="profileRole">Data Scientist / AI Engineer</p>
                    <p class="profileBio">I build computer-vision systems and local-first AI products in Madrid.</p>
                    {{ partial "profile-social.html" . }}
                </div>
            </main>
        </div>

        {{ partial "footer.html" . }}
    </div>

</body>

</html>
