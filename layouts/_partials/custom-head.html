<style>
  /* Nightfall centres .content and floats .postTitle next to .postDate. On
     list pages that leaves long titles centred, capitalises every word and
     drops the date onto its own line. Keep the original casing, align the
     title left and lay the header out as a row so dates stay on the right. */

    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
  }

  .postTitle {
    float: none;
    text-align: left;
    text-transform: none;
  }

  .postDate {
    float: none;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .archiveYear h2 {
    text-align: left;
  }

  /* Home profile card, adapted from hugo-coder's centered author card. */

    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 2rem 1rem 3rem;
  }

  .profileAvatar {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    object-fit: cover;
    image-rendering: pixelated;
    border: 2px solid #80aadd;
    box-shadow: 0 0 0 6px #252627;
  }

  .profileName {
    margin: 1.25rem 0 0;
    font-family: "Fira Mono", monospace;
    font-size: 2.6rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: #f8f8ff;
  }

  .profileRole {
    margin: 0.45rem 0 0;
    font-family: "Open Sans", sans-serif;
    font-size: 1.15rem;
    color: #c9c9cf;
  }

  .profileBio {
    max-width: 540px;
    margin: 0.5rem 0 1.4rem;
    font-family: "Open Sans", sans-serif;
    font-size: 0.98rem;
    line-height: 1.6;
    color: #a8a8b3;
  }

  .profileSocial {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.4rem;
  }

  .profileSocial a {
    display: inline-flex;
    padding: 0.25rem;
    color: #f8f8ff;
    transition: color 0.18s ease, transform 0.18s ease;
  }

  .profileSocial a:hover {
    color: #80aadd;
    transform: translateY(-2px);
  }

  .profileSocial svg {
    width: 26px;
    height: 26px;
  }

  .activeProjects {
    margin-top: 2.1rem;
  }

    flex-wrap: wrap;
    justify-content: center;
    gap: 0.55rem;
  }

  .activeProjectsLinks a {

    border: 1px solid #3a3b3d;
    border-radius: 999px;

    font-family: "Fira Mono", monospace;
    font-size: 0.78rem;
    text-decoration: none;
    transition: color 0.18s ease, border-color 0.18s ease;
  }

  .activeProjectsLinks a:hover {
    color: #80aadd;
    border-color: #80aadd;
    text-decoration: none;
  }
  @font-face {
    font-family: "Inter Variable";

  }

  .entry-link {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
  }

  .page-header,
  .post-header {

  }

  }

    margin-bottom: 5px;
    color: var(--secondary);
  }

    gap: 0.4rem;

  }

  }

    color: var(--content);
  }

    margin: 28px 0 20px;

  }

  .post-content h2 {
    margin: 24px 0 16px;

    margin: 24px 0 16px;
    font-size: 18px;

  .post-content h4 {
    margin: 24px 0 16px;

  }

  .post-content h5 {
    margin: 24px 0 16px;

  .post-content h6 {

  }

  .post-content p,
  .post-content ul,
  .post-content ol,

  }

    flex-wrap: wrap;
    gap: 10px;
    list-style: none;
  }

  .post-tags li {
    display: inline-block;
  }

  .post-tags a {
    display: block;
    padding: 0 14px;
    color: var(--secondary);
    font-size: 14px;
    line-height: 34px;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .post-tags a:hover {
    background: var(--border);
  }

  .paginav {
