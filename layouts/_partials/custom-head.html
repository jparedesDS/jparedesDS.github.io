<style>
  /* Nightfall centres .content and floats .postTitle next to .postDate. On
     list pages that leaves long titles centred, capitalises every word and
     drops the date onto its own line. Keep the original casing, align the
     title left and lay the header out as a row so dates stay on the right. */
  .postHeader {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
  }

  .postTitle {
    float: none;
    text-align: left;
    text-transform: none;
  }

  .postDate {
    float: none;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .archiveYear h2 {
    text-align: left;
  }

  /* Home profile card, adapted from hugo-coder's centered author card. */
  .profileCard {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 2rem 1rem 3rem;
  }

  .profileAvatar {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    object-fit: cover;
    image-rendering: pixelated;
    border: 2px solid #80aadd;
    box-shadow: 0 0 0 6px #252627;
  }

  .profileName {
    margin: 1.25rem 0 0;
    font-family: "Fira Mono", monospace;
    font-size: 2.6rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: #f8f8ff;
  }

  .profileRole {
    margin: 0.45rem 0 0;
    font-family: "Open Sans", sans-serif;
    font-size: 1.15rem;
    color: #c9c9cf;
  }

  .profileBio {
    max-width: 540px;
    margin: 0.5rem 0 1.4rem;
    font-family: "Open Sans", sans-serif;
    font-size: 0.98rem;
    line-height: 1.6;
    color: #a8a8b3;
  }

  .profileSocial {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.4rem;
  }

  .profileSocial a {
    display: inline-flex;
    padding: 0.25rem;
    color: #f8f8ff;
    transition: color 0.18s ease, transform 0.18s ease;
  }

  .profileSocial a:hover {
    color: #80aadd;
    transform: translateY(-2px);
  }

  .profileSocial svg {
    width: 26px;
    height: 26px;
  }

  .activeProjects {
    margin-top: 2.1rem;
  }

  .activeProjectsLabel {
    margin: 0 0 0.7rem;
    font-family: "Fira Mono", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #a8a8b3;
  }

  .activeProjectsLinks {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.55rem;
  }

  .activeProjectsLinks a {
    padding: 0.4rem 0.75rem;
    border: 1px solid #3a3b3d;
    border-radius: 999px;
    color: #f8f8ff;
    font-family: "Fira Mono", monospace;
    font-size: 0.78rem;
    text-decoration: none;
    transition: color 0.18s ease, border-color 0.18s ease;
  }

  .activeProjectsLinks a:hover {
    color: #80aadd;
    border-color: #80aadd;
    text-decoration: none;
  }

  /* Blog children: tags/archive/faq live under ~/blog. */
  .headerWrapper {
    overflow: visible;
  }

  .headerLinks > ul > li.has-children {
    position: relative;
  }

  .headerLinks > ul > li.has-children > a::after {
    content: " ▾";
    font-size: 0.8em;
    color: #a8a8b3;
  }

  .headerLinks .submenu {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    left: auto;
    z-index: 20;
    min-width: 150px;
    margin: 0;
    padding: 8px 0;
    list-style: none;
    background: #252627;
    border: 1px solid #3a3b3d;
    border-radius: 4px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
  }

  .headerLinks .submenu li {
    display: block;
    margin: 0;
  }

  .headerLinks .submenu a {
    display: block;
    padding: 7px 14px;
    text-align: left;
  }

  .headerLinks .submenu a:hover {
    background: #303134;
    text-decoration: none;
  }

  .headerLinks > ul > li.has-children:hover .submenu,
  .headerLinks > ul > li.has-children:focus-within .submenu {
    display: block;
  }

  @media screen and (max-width: 768px) {
    .headerLinks .submenu {
      display: flex;
      position: static;
      flex-direction: column;
      align-items: center;
      padding: 0;
      margin-top: 4px;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .headerLinks .submenu a {
      padding: 6px 0;
      text-align: center;
    }

    .headerLinks > ul > li.has-children > a::after {
      content: "";
    }
  }
</style>
