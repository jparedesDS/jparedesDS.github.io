{{- $p := .RelPermalink -}}
<nav class="blogNav" aria-label="Blog">
  <a href="/en/blog/"{{ if eq $p "/en/blog/" }} class="active" aria-current="page"{{ end }}>Blog</a>
  <a href="/en/blog/search/"{{ if hasPrefix $p "/en/blog/search" }} class="active" aria-current="page"{{ end }}>Search</a>
  <a href="/en/blog/tags/"{{ if hasPrefix $p "/en/blog/tags" }} class="active" aria-current="page"{{ end }}>Tags</a>
  <a href="/en/blog/archives/"{{ if eq $p "/en/blog/archives/" }} class="active" aria-current="page"{{ end }}>Archive</a>
  <a href="/en/blog/faq/"{{ if eq $p "/en/blog/faq/" }} class="active" aria-current="page"{{ end }}>FAQ</a>
</nav>
