baseURL = "https://jparedesds.github.io/"
locale = "en-us"
title = "Jose Paredes"
theme = "nightfall"
publishDir = "dist"

[module]
  [module.hugoVersion]
    min = "0.158.0"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"

[permalinks]
  blog = "/blog/:year/:month/:day/:slug/"
  tags = "/blog/tags/:slug/"

[menu]
  [[menu.header]]
    name = "about"
    # Hugo sorts weight 0 as unset, which would place "about" last.
    weight = -1
    url = "about"
  [[menu.header]]
    name = "projects"
    weight = 1
    url = "projects"
  [[menu.header]]
    name = "blog"
    weight = 2
    url = "blog"
  [[menu.header]]
    name = "contact"
    weight = 3
    url = "contact"

[params]
user = "hello"
hostname = "jparedesDS"
openLinksInNewTab = true
displayDateFormat = "2006-01-02"
showMetadata = true
showPublishedDate = true
showReadingTime = true
showTags = true
showAuthors = false
showCategories = false
sitedescription = "Data scientist and AI engineer in Madrid."
footerHtml = '© 2026 Jose Paredes · Built with <a href="https://gohugo.io" class="footerLink">Hugo</a> and <a href="https://github.com/LordMathis/hugo-theme-nightfall" class="footerLink">Nightfall</a>'

