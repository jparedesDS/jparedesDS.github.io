baseURL = "https://jparedesds.com/"
locale = "en-us"
title = "Jose Paredes"
theme = "nightfall"
publishDir = "dist"
# dist/ is a build artifact (gitignored): wipe the leftovers so a build
# never ships a stale file, e.g. a second 404 document (Task 8).
cleanDestinationDir = true
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages.en]
  contentDir = "content/en"
  languageName = "English"
  languageCode = "en"
  weight = 1
[languages.en.params]
  resumeUrl = "/resume.pdf"
[languages.es]
  contentDir = "content/es"
  languageName = "Español"
  languageCode = "es"
  weight = 2
  # The blog (and its tags) is English-only: no empty /es/tags/ scaffold.
  # GitHub Pages serves only the root /404.html (Task 8): the Spanish
  # 404 kind is disabled so a single bilingual 404 document ships.
  disableKinds = ["taxonomy", "term", "404"]
[languages.es.params]
  # Task 11: the Spanish CV ships as /resume-es.pdf.
  resumeUrl = "/resume-es.pdf"
  # Localized positioning: every ES page inherits this description
  # instead of the English one.
  sitedescription = "Ingeniero de Computer Vision y ML en Madrid. Control de calidad industrial y productos de IA local-first."

[module]
  [module.hugoVersion]
    min = "0.158.0"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"

[permalinks]
  blog = "/blog/:year/:month/:day/:slug/"
  tags = "/blog/tags/:slug/"

[menu]
  [[menu.header]]
    name = "about"
    # Hugo sorts weight 0 as unset, which would place "about" last.
    weight = -1
    url = "about"
  [[menu.header]]
    name = "projects"
    weight = 1
    url = "projects"
  [[menu.header]]
    name = "repos"
    weight = 2
    url = "repositories"
  [[menu.header]]
    name = "cv"
    weight = 3
    url = "cv"
  [[menu.header]]
    name = "blog"
    weight = 4
    url = "blog"
  [[menu.header]]
    name = "contact"
    weight = 5
    url = "contact"

[params]
user = "hello"
hostname = "jparedesDS"
openLinksInNewTab = true
displayDateFormat = "2006-01-02"
showMetadata = true
showPublishedDate = true
showReadingTime = true
showTags = true
showAuthors = false
showCategories = false
sitedescription = "Computer Vision & ML Engineer in Madrid. Industrial quality control and local-first AI products."
footerHtml = '© 2026 Jose Paredes · Built with <a href="https://gohugo.io" class="footerLink">Hugo</a> and <a href="https://github.com/LordMathis/hugo-theme-nightfall" class="footerLink">Nightfall</a>'

